[workspace]
authors = ["FreekPols <c.f.j.pols@tudelft.nl>"]
channels = ["conda-forge"]
name = "starterkit"
platforms = ["win-64","osx-64", "osx-arm64","linux-64"]
version = "0.1.0"

[tasks]
editor = "jupyter lab"
preview = "myst start"
pdf = "myst build --pdf"

[dependencies]
numpy = ">=2.5.2,<3"
matplotlib = ">=3.11.1,<4"
scipy = ">=1.18.0,<2"
ipywidgets = ">=8.1.9,<9"

[feature.dev.dependencies]
jupyterlab = ">=4.6.3,<5"
typst = ">=0.15.1,<0.16"
jupytext = ">=1.19.5,<2"
nodejs = ">=26.8.1,<26.9"
mystmd = ">=1.10.1,<2"

[feature.dev.pypi-dependencies]
jupyterlab-myst = ">=2.7.0, <3"

[feature.ci.dependencies]
python = "3.11.*"
ipykernel = "*"
jupyter-server = "*"
nbclient = "*"
nbformat = "*"
jupyter_client = "*"
ipython = "*"


[environments]
default = ["dev"]
ci = []