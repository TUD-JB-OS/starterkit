[workspace]
authors = ["FreekPols <c.f.j.pols@tudelft.nl>"]
channels = ["conda-forge"]
name = "starterkit"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
editor = "jupyter lab"
preview = "myst start"
pdf = "myst build --pdf"

[dependencies]
jupyterlab = ">=4.6.3,<5"
mystmd = ">=1.10.1,<2"
numpy = ">=2.5.2,<3"
matplotlib = ">=3.11.1,<4"
scipy = ">=1.18.0,<2"
ipywidgets = ">=8.1.9,<9"
typst = ">=0.15.1,<0.16"
jupytext = ">=1.19.5,<2"
nodejs = "24.*"
[pypi-dependencies]
jupyterlab-myst = ">=2.7.0, <3"
