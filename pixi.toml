[workspace]
authors = ["FreekPols <c.f.j.pols@tudelft.nl>"]
channels = ["conda-forge"]
name = "starterkit"
platforms = ["win-64","osx-64", "osx-arm64","linux-64"]
version = "0.2.0"

[tasks]
editor = "jupyter lab"
preview = "myst start"
pdf = "myst build --pdf"

[dependencies]
python = "3.11.*"
numpy = ">=2.5.2,<3"
matplotlib = ">=3.11.1,<4"
scipy = ">=1.18.0,<2"
ipywidgets = ">=8.1.9,<9"

jupyterlab = ">=4.6.3,<5"
nodejs = "26.12.1.*"
mystmd = "1.11.*"

typst = ">=0.15.1,<0.16"
jupytext = ">=1.19.5,<2"

ipykernel = "*"

[pypi-dependencies]
jupyterlab_myst = "*"


