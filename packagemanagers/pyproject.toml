[project]
name = "starterkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5.2,<3",
    "matplotlib>=3.11.1,<4",
    "scipy>=1.18.0,<2",
    "ipywidgets>=8.1.9,<9",
]

[dependency-groups]
ci = [
    "jupyter-server",
    "nbclient",
    "nbformat",
    "ipykernel",
    "jupyter-client",
    "ipython",
]

dev = [
    "jupyterlab>=4.6.3,<5",
    "jupytext>=1.19.5,<2",
    "jupyterlab-myst>=2.7.0,<3",
]